<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TAB__</title>
<style>
:root{--surface:#fcfcfb;--text:#0b0b0b;--text2:#52514e;--muted:#8a8984;--grid:#e6e5e0;--band:#f0efea;--series:#2a78d6;--good:#0ca30c;--crit:#d03b3b;--zero:#b9b8b2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#1a1a19;--text:#fff;--text2:#c3c2b7;--muted:#8f8e86;--grid:#2c2c2a;--band:#242422;--series:#3987e5;--good:#2fb82f;--crit:#e05a5a;--zero:#55544f}}
:root[data-theme="dark"]{--surface:#1a1a19;--text:#fff;--text2:#c3c2b7;--muted:#8f8e86;--grid:#2c2c2a;--band:#242422;--series:#3987e5;--good:#2fb82f;--crit:#e05a5a;--zero:#55544f}
body{margin:0;background:var(--surface);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0 0 2px}.sub{color:var(--text2);margin:0 0 12px;font-size:13px}
.tiles{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 12px}.tile{flex:1 1 140px;border:1px solid var(--grid);border-radius:8px;padding:8px 10px}
.tile b{display:block;font-size:20px}.tile span{color:var(--text2);font-size:12px}
.chart{position:relative}svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--grid);border-radius:6px;padding:6px 8px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.12);display:none;white-space:nowrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--text2);font-size:12px;margin:6px 0 14px}.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
table{border-collapse:collapse;width:100%;font-size:13px;margin:4px 0 16px}th,td{text-align:right;padding:4px 8px;border-bottom:1px solid var(--grid)}th:first-child,td:first-child{text-align:left}th{color:var(--text2);font-weight:600}
h2{font-size:15px;margin:14px 0 4px}
</style></head><body><div class="wrap">
<h1>__TITLE__</h1>
<p class="sub">__SUB__</p>
<div class="tiles" id="tiles"></div>
<div class="chart" id="chart"><div class="tip" id="tip"></div></div>
<div class="legend"><span><i class="sw" style="background:var(--series)"></i>Cumulative PnL</span><span><i class="sw" style="background:var(--good)"></i>Peak</span><span><i class="sw" style="background:var(--crit)"></i>Low</span><span><i class="sw" style="background:var(--band);border:1px solid var(--grid)"></i>__BAND__</span></div>
<h2>By session (UTC, by fill time)</h2><table id="ses"></table>
<h2>By day</h2><table id="days"></table>
</div>
<script>
const P=__DATA__, HI=__HI__, LO=__LO__, DAYS=__DAYS__, SES=__SES__;
const f=v=>(v>=0?'+':'−')+'$'+Math.abs(v).toFixed(2);
const T=P.map(p=>new Date(p.t.endsWith('Z')||p.t.includes('+')?p.t:p.t+'Z').getTime());
document.getElementById('tiles').innerHTML=[['Final',f(P[P.length-1].v)],['Peak',f(P[HI].v)+' · '+P[HI].t.slice(5,16).replace('T',' ')],['Low',f(P[LO].v)+' · '+P[LO].t.slice(5,16).replace('T',' ')],['Fills',P.length+' · '+P.filter(p=>+p.won===1).length+' won']].map(([k,v])=>`<div class="tile"><span>${k}</span><b>${v}</b></div>`).join('');
const W=940,H=380,m={l:56,r:16,t:16,b:34},iw=W-m.l-m.r,ih=H-m.t-m.b;
const t0=Math.min(...T),t1=Math.max(...T),vals=P.map(p=>p.v),vmin=Math.min(0,...vals),vmax=Math.max(0,...vals),pad=(vmax-vmin)*.08||1;
const x=t=>m.l+(t-t0)/(t1-t0||1)*iw,y=v=>m.t+(1-(v-(vmin-pad))/((vmax+pad)-(vmin-pad)))*ih;
let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative PnL line chart">`;
for(let d=new Date(t0);d.getTime()<=t1;d=new Date(d.getTime()+864e5)){const a=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()),b=a+13*36e5;const xa=Math.max(x(Math.max(a,t0)),m.l),xb=Math.min(x(Math.min(b,t1)),W-m.r);if(xb>xa)s+=`<rect x="${xa}" y="${m.t}" width="${xb-xa}" height="${ih}" fill="var(--band)"/>`;}
const step=(vmax-vmin)/4||1;for(let i=0;i<=5;i++){const v=vmin+i*((vmax-vmin)/5);s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${m.l-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--text2)">${f(v)}</text>`;}
s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--zero)" stroke-dasharray="3 3"/>`;
const nt=6;for(let i=0;i<=nt;i++){const t=t0+(t1-t0)*i/nt,d=new Date(t);s+=`<text x="${x(t)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--text2)">${(d.getUTCMonth()+1)}-${String(d.getUTCDate()).padStart(2,'0')} ${String(d.getUTCHours()).padStart(2,'0')}:00</text>`;}
s+=`<path d="${P.map((p,i)=>(i?'L':'M')+x(T[i]).toFixed(1)+','+y(p.v).toFixed(1)).join('')}" fill="none" stroke="var(--series)" stroke-width="2" stroke-linejoin="round"/>`;
[[HI,'var(--good)','Peak'],[LO,'var(--crit)','Low']].forEach(([i,c,l])=>{s+=`<circle cx="${x(T[i])}" cy="${y(P[i].v)}" r="5" fill="${c}" stroke="var(--surface)" stroke-width="2"/><text x="${x(T[i])}" y="${y(P[i].v)+(l==='Peak'?-10:18)}" text-anchor="middle" font-size="12" fill="var(--text)">${l} ${f(P[i].v)}</text>`;});
s+=`<line id="xh" y1="${m.t}" y2="${m.t+ih}" stroke="var(--muted)" visibility="hidden"/><circle id="dot" r="4" fill="var(--series)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/><rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" id="hit"/></svg>`;
const C=document.getElementById('chart');C.insertAdjacentHTML('beforeend',s);
const svg=C.querySelector('svg'),tip=document.getElementById('tip'),xh=svg.querySelector('#xh'),dot=svg.querySelector('#dot');
svg.querySelector('#hit').addEventListener('mousemove',e=>{const r=svg.getBoundingClientRect(),sx=(e.clientX-r.left)*W/r.width;let b=0,bd=1e18;T.forEach((t,i)=>{const d=Math.abs(x(t)-sx);if(d<bd){bd=d;b=i}});const p=P[b];
xh.setAttribute('x1',x(T[b]));xh.setAttribute('x2',x(T[b]));xh.setAttribute('visibility','visible');dot.setAttribute('cx',x(T[b]));dot.setAttribute('cy',y(p.v));dot.setAttribute('visibility','visible');
tip.style.display='block';tip.innerHTML=`<b>${p.t.replace('T',' ').slice(0,19)} UTC</b><br>cumulative ${f(p.v)}<br>this fill ${f(p.p)} · ${p.side} @ ${p.price} · ${+p.won===1?'won':'lost'} · ${p.s}`;
const px=x(T[b])*r.width/W;tip.style.left=Math.min(px+12,r.width-tip.offsetWidth-4)+'px';tip.style.top=(y(p.v)*r.height/H-40)+'px';});
svg.querySelector('#hit').addEventListener('mouseleave',()=>{tip.style.display='none';xh.setAttribute('visibility','hidden');dot.setAttribute('visibility','hidden')});
const order=['asia','europe','us','late'];
document.getElementById('ses').innerHTML='<tr><th>Session (UTC)</th><th>Fills</th><th>Won</th><th>PnL</th></tr>'+Object.keys(SES).sort((a,b)=>order.indexOf(a)-order.indexOf(b)).map(k=>`<tr><td>${k}</td><td>${SES[k][0]}</td><td>${SES[k][1]}</td><td>${f(SES[k][2])}</td></tr>`).join('');
document.getElementById('days').innerHTML='<tr><th>Day (UTC)</th><th>Fills</th><th>PnL</th></tr>'+Object.keys(DAYS).sort().map(k=>`<tr><td>${k}</td><td>${DAYS[k][0]}</td><td>${f(DAYS[k][1])}</td></tr>`).join('');
</script></body></html>
